[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chromex-otomasyon"
version = "1.1.0"
description = "API-öncelikli araştırma otomasyonu (onay kapısı + SHA-256 audit zinciri)"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
otomasyon = "orchestrator.cli:main"
chromex-mcp = "mcp_server.server:main"

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]

[tool.setuptools]
packages = ["core", "workers", "orchestrator", "mcp_server"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
