name: test

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bagimliliklar
        run: |
          pip install -e ./policy-gate
          pip install -r windows-browser-automation/requirements.txt
      - name: policygate testleri (13 adet, offline)
        working-directory: policy-gate
        run: python -m unittest discover -s tests -v
      - name: wba testleri (43 adet, offline)
        working-directory: windows-browser-automation
        run: python -m unittest discover -s tests -v