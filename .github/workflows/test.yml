name: test

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bagimliliklar
        run: |
          pip install -e ./policy-gate
          pip install -e "./windows-browser-automation[mcp]"
      - name: policygate testleri (41 adet, offline)
        working-directory: policy-gate
        run: python -m unittest discover -s tests -v
      - name: wba testleri (139 adet, offline)
        working-directory: windows-browser-automation
        run: python -m unittest discover -s tests -v
      - name: Sprint 1 canlı MCP smoke
        working-directory: windows-browser-automation
        run: python scripts/mcp_smoke.py
      - name: model yönetimi testleri (10 adet, offline)
        working-directory: claude-code-automation
        run: python -m unittest discover -s tests -v
