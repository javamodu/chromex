[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-gate"  # PyPI'da "policygate" dolu; import adı policygate kalır
version = "1.0.0"
description = "AI ajanları için sıfır-bağımlılıklı onay kapısı + SHA-256 audit zinciri (stdlib-only)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["agent", "approval", "audit", "policy", "human-in-the-loop", "llm", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/javamodu/chromex"

[project.optional-dependencies]
http = ["requests>=2.31"]

[tool.setuptools.package-data]
policygate = ["py.typed"]
