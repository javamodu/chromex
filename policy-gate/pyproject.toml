[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policygate"
version = "0.1.0"
description = "AI ajanları için sıfır-bağımlılıklı onay kapısı + SHA-256 audit zinciri (stdlib-only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agent", "approval", "audit", "policy", "human-in-the-loop", "llm", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://example.invalid/policygate"  # TODO: yayın öncesi gerçek repo URL'si

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
http = ["requests>=2.31"]

[tool.setuptools.package-data]
policygate = ["py.typed"]
